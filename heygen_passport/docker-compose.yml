# Heygen Passport on Docker Desktop, using the SQL Server installed on this PC.
#
#   1. copy local.env.example to local.env and fill in the "Docker" values
#   2. docker compose -f heygen_passport/docker-compose.yml up -d --build
#   3. docker compose -f heygen_passport/docker-compose.yml run --rm heygen python -m heygen_passport.manage create-admin
#   4. open http://localhost:8502
#
# Hotel data stays in your SQL Server database (HeygenPassport); the container
# itself stores nothing, so it can be rebuilt or removed at any time.
name: heygen-passport

services:
  heygen:
    build:
      context: ..
      dockerfile: heygen_passport/Dockerfile
    image: heygen-passport:latest
    env_file:
      - local.env
    environment:
      HEYGEN_DB_ENGINE: mssql
    ports:
      - "${HEYGEN_PORT:-8502}:8502"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
